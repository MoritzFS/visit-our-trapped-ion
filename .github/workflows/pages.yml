# Build the VR page from source and publish it on GitHub Pages.
#
# Pages is served over https, which is all WebXR asks for: the headset opens
# the URL and gets Enter VR, no serve.py and no certificate to click through.
# build.py needs nothing beyond the standard library.

name: Pages

on:
  push:
    branches: [main]
    paths:
      - "traart/vr/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Build trap_vr.html
        run: python3 traart/vr/build.py
      - name: Assemble site
        run: |
          mkdir _site
          cp traart/vr/trap_vr.html _site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
