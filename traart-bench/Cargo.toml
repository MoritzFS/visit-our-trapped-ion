[package]
name = "traart-bench"
version = "0.1.0"
edition = "2024"
description = "Listen to ion trap sequences"

[dependencies]
eframe = "0.31"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = "0.15"
# The bench also serves the VR page and a clock the headset slaves to, so it
# needs TLS: WebXR will not enter immersive mode over plain http on a LAN
# address. ring rather than aws-lc-rs so the build needs no cmake or nasm.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }

# In the browser (trunk build, see web/): Web Audio instead of cpal, local
# storage instead of a tunings file, a download instead of a WAV on disk.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement",
    "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "Storage",
    "Response", "Event", "EventTarget", "AddEventListenerOptions",
    "AudioContext", "AudioContextState", "BaseAudioContext", "AudioNode",
    "AudioDestinationNode", "ScriptProcessorNode", "AudioProcessingEvent",
    "AudioBuffer",
] }

[profile.release]
opt-level = 3
lto = "thin"
