[package]
name = "traart-bench"
version = "0.1.0"
edition = "2024"
description = "Listen to ion trap sequences"

[dependencies]
cpal = "0.15"
eframe = "0.31"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# The bench also serves the VR page and a clock the headset slaves to, so it
# needs TLS: WebXR will not enter immersive mode over plain http on a LAN
# address. ring rather than aws-lc-rs so the build needs no cmake or nasm.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }

[profile.release]
opt-level = 3
lto = "thin"
